<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
hereemeta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Htetmyat Quiz Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0; padding: 0;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden;
    }
    .container {
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      width: 380px;
      padding: 30px 40px 60px 40px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      text-align: center;
      position: relative;
      backdrop-filter: blur(12px);
    }
    .intro-text {
      font-size: 3rem; font-weight: 800;
      background: linear-gradient(90deg,#ff9966,#ff5e62);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: fadeIn 2.5s forwards;
    }
    @keyframes fadeIn {0%{opacity:0;transform:scale(0.7);}100%{opacity:1;transform:scale(1);}}
    .hidden { display: none; }
    .question-box {
      margin-top: 20px; background: rgba(255,255,255,0.08);
      border-radius: 12px; padding: 20px; font-size: 1.1rem; line-height: 1.4;
      animation: fadeInUp 0.7s ease forwards; min-height: 70px;
    }
    @keyframes fadeInUp {0%{opacity:0;transform:translateY(20px);}100%{opacity:1;transform:translateY(0);}}
    input[type="text"] {
      margin-top: 15px; padding: 12px 15px; font-size: 1rem;
      border: none; border-radius: 25px; width: 90%; outline: none;
      transition: box-shadow 0.3s ease;
    }
    input[type="text"]:focus {box-shadow: 0 0 8px 2px #ff9966;}
    button {
      margin-top: 20px; background: linear-gradient(90deg,#ff9966,#ff5e62);
      border: none; padding: 12px 25px; font-size: 1rem;
      border-radius: 25px; cursor: pointer; color: white; font-weight: 700;
      transition: transform 0.2s ease;
    }
    button:hover {transform: scale(1.05);}
    .message {margin-top: 15px; font-weight: 600; font-size: 1.1rem; min-height: 1.5em;}
    .congrats {color: #4caf50;}
    .fail {color: #f44336;}
    .restart-icon {
      position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
      cursor: pointer; background: #ff5e62; padding: 25px 35px; border-radius: 50%;
      font-weight: 700; font-size: 3rem; user-select: none;
      box-shadow: 0 0 25px #ff9966; display: none;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .restart-icon.show {display: flex;}
    #finalScore {font-size: 1.6rem; font-weight: 700; margin-top: 25px;}
    #totalPoints {margin-top: 15px; font-size: 1.1rem; font-weight: 600; color: #ffb347;}
    /* name -> image */
    .fade-img-box {
      text-align: center; opacity: 0; transform: scale(0.8);
      transition: opacity 1s ease, transform 1s ease;
      position: absolute; left: 50%; top: 40px; width: 84%;
      margin-left: -42%; z-index: 40;
    }
    .fade-img-box.show { opacity: 1; transform: scale(1); }
    #congratsOverlay img { max-width: 90%; height: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div id="intro" class="intro-text">Unknown BG</div>
    <div id="totalPoints"></div>
    <button id="startBtn">Start Music</button>

    <!-- Name Box -->
    <div id="nameBox" class="hidden">
      <div class="question-box">🧑‍🏫 What is your name?</div>
      <input type="text" id="nameInput" placeholder="Enter your name..." />
      <button id="nameSubmitBtn">Confirm</button>
    </div>

    <!-- Quiz Area -->
    <div id="quizArea" class="hidden">
      <div id="questionBox" class="question-box"></div>
      <input type="text" id="answerInput" placeholder="ဖြေဆိုရန် 📝" autocomplete="off" />
      <button id="submitBtn">အဖြေတိုက်မည်</button>
      <div id="message" class="message"></div>
    </div>

    <!-- Thank you / Score -->
    <div id="thankYou" class="hidden">
      <div id="finalScore" class="congrats"></div>
    </div>

    <!-- Restart -->
    <div id="restartIcon" class="restart-icon" title="Restart Quiz">
      <div class="arrow">&#10227;</div>
    </div>
  </div>

  <!-- Audio -->
  <audio id="bgMusic" src="assets/background.mp3" loop></audio>
  <audio id="correctSound" src="assets/correct.mp3"></audio>
  <audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
/* ---------------- questions + config ---------------- */
const questions = [
  {id:1,text:"အဓိက အပိုင်း ၃ပိုင်း ကို ဖြေဆိုပါ",correctKeywords:["computer","network","power"]},
  {id:2,text:"ဖုန်းတစ်လုံးကို စက်နှိုးဖို့ ဗို့အား အနည်းဆုံး ဘယ်လောက်ရှိရမလဲ?",correctKeywords:["3.6","3 6","3.6v"]},
  {id:3,text:"Network ပိုင်းမှာ နှစ်မျိုးရှိတယ် အဲ့တာဘာတေလဲ့ ?",correctKeywords:["sim လိုတဲ့ network","sim မလိုတဲ့ network","with sim","without sim"]},
  {id:4,text:"Coil ရဲ့ စာသင်ကေတတေ ဖြေဆိုပါ English!",correctKeywords:["l","lb","pl","fb","b"]},
  {id:5,text:"Computer ပိုင်းမှာ ဘာတေရှိလဲ့ Englishလိုဖြေ?",correctKeywords:["cpu","emmc"]},
  {id:6,text:"Phone တစ်လုံးမှာ Battery ငုတ် ဘယ်နှစ်ငုတ်ပါလဲ့?",correctKeywords:["4","5","၄","၅"]},
  {id:7,text:"ဖုန်းservice လုပ်တော့မယ်ဆို အကြမ်းဖျင်း heatgun အပူ ဘယ်လောက်လဲ့? လေကရော ဘယ်လောက်လဲ့?",correctKeywords:["365","55","365°","55°"]},
  {id:8,text:"Crystal ရဲ့ စာသင်ကေတက ဘာလဲ့?",correctKeywords:["x","y"]},
  {id:9,text:"Phone တစ်လုံးမှာ Batteryပင် 5ပင် ပါတယ်ဆိုရင် 2ပင်က +- 2ပင်က detat(ဒီတက်😁)ဆိုရင် ကျန်တဲ့ 1ပင်က ဘာပင်ဖြစ်မလဲ့?",correctKeywords:["nc"]},
  {id:10,text:"4ပင် crystalအကြီး က ဘယ်အပိုင်းမှာရှိလဲ့?",correctKeywords:["sim မလိုတဲ့ network","without sim","no sim"]},
  {id:11,text:"Aug 20 2025 တုန်းက ၅လွှာအတက်ဆင်းလုပ်ရတာ ပျော်လား?",correctKeywords:["ဆရာမေးခွန်းသတ်တာ"]},
  {id:12,text:"2ပင် crystal က ဘယ်အပိုင်းမှာရှိလဲ့?",correctKeywords:["power","main pmu"]},
  {id:13,text:"မီတာ တိုင်းတာနည်း ဘယ်နှစ်နည်းရှိလဲ့? 2နည်း 3နည်း 4နည်း 5နည်း?",correctKeywords:["4နည်း","4"]},
  {id:14,text:"crystal ဘယ်နှစ်မျိုးရှိလဲ?",correctKeywords:["2"]},
  {id:15,text:"zero ohm တေပျက်ရင် ခဲပူးလို့ရလား yes or no ဖြေ?",correctKeywords:["no"]},
  {id:16,text:"R တွေပျက်ရင် error အတိကျရှိလား yes or no ဖြေ?",correctKeywords:["no"]},
  {id:17,text:"R အမျိုးအစား ဘယ်နှစ်မျိုးရှိသလဲ့?",correctKeywords:["2"]},
  {id:18,text:"Capacitor ဘယ်နှစ်မျိုးရှိလဲ့?",correctKeywords:["3"]},
  {id:19,text:"Fitter Capacitor ကဘယ်နေရာမှာရှိလဲ?",correctKeywords:["နေရာတိုင်း"]},
  {id:20,text:"Fuse က ဘယ်နေရာမှာရှိလဲ?",correctKeywords:["CHG","ခေါင်းနားမှာ"]},
  {id:21,text:"Fuse ပျက်လျှင် ဘာerrorဖြစ်လဲ?",correctKeywords:["CHG","အားမဝင်"]},
  {id:22,text:"Copuling Capacitor က ဘယ်နေရာမှာရှိလဲ့?",correctKeywords:["CHG","SPK"]}
];
const POINTS_PER_QUESTION = 2;
let currentQIndex = 0, randomizedOrder = [], score = 0, playerName = "";

/* ---------------- element refs ---------------- */
const introEl = document.getElementById('intro');
const totalPointsEl = document.getElementById('totalPoints');
const quizArea = document.getElementById('quizArea');
const questionBox = document.getElementById('questionBox');
const answerInput = document.getElementById('answerInput');
const submitBtn = document.getElementById('submitBtn');
const messageEl = document.getElementById('message');
const thankYouEl = document.getElementById('thankYou');
const finalScoreEl = document.getElementById('finalScore');
const restartIcon = document.getElementById('restartIcon');
const bgMusic = document.getElementById('bgMusic');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const nameBox = document.getElementById('nameBox');
const nameInput = document.getElementById('nameInput');
const nameSubmitBtn = document.getElementById('nameSubmitBtn');

/* name -> image */
const nameImageMap = {
  "ရှမ်းမဲ": "assets/names/shanmae.jpg",
  "ငကြွက်": "assets/names/ngakywet.jpg",
  "ကောက်ကြီး": "assets/names/kaukgyi.jpg",
  "pau": "assets/names/pau.jpg",
  "hak": "assets/names/hak.jpg",
  "gin": "assets/names/gin.jpg",
  "phyo": "assets/names/phyo.jpg",
  "nyi lin": "assets/names/nyilin.jpg",
  "nan pyae": "assets/names/nanpyae.jpg",
  "joeshu": "assets/names/joeshu.jpg",
  "mental": "assets/names/mental.jpg",
  "z": "assets/names/z.jpg"
};
const normalizedNameImageMap = {};
for (const k in nameImageMap) normalizedNameImageMap[k.trim().toLowerCase()] = nameImageMap[k];

/* helpers */
function shuffleArray(array){let arr=array.slice();for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function normalizeText(text){return (text||"").toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()?"“”‘’]/g,'').replace(/\s+/g,' ').trim();}
function isAnswerCorrect(userInput,keywords){const normalizedInput=normalizeText(userInput);return keywords.some(keyword=>normalizedInput.includes(normalizeText(keyword)));}

/* show special image */
function showSpecialImage(displayName,imgSrc){
  nameBox.classList.add('hidden');
  const imgBox=document.createElement('div');
  imgBox.className="fade-img-box";
  imgBox.innerHTML=`<h2>${displayName} 😛</h2><img src="${imgSrc}" style="max-width:100%;border-radius:12px"/>`;
  document.querySelector('.container').appendChild(imgBox);
  setTimeout(()=>{imgBox.classList.add('show');},50);
  setTimeout(()=>{imgBox.classList.remove('show');setTimeout(()=>{imgBox.remove();startQuiz();},1000);},3000);
}

/* congrats overlay */
function showCongratsOverlay(){
  const overlay=document.createElement('div');
  overlay.id='congratsOverlay';
  overlay.style=`position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);z-index:9999;`;
  overlay.innerHTML=`<div style="text-align:center;"><img src="assets/congrats.gif" alt="Congrats"/><div>Congratulations!</div></div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>{overlay.remove();},4000);
}

/* Telegram send */
function sendToTelegram(msg){
  const token="7602210710:AAGp7tskS5W95pf2WaF-gOb6sy9qzxImXJY"; 
  const chatId="7358958980";  
  fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chat_id:chatId,text:msg})
  }).catch(err=>console.error("Telegram Error:",err));
}

/* quiz functions */
function startQuiz(){
  score=0;currentQIndex=0;randomizedOrder=shuffleArray(questions.map((_,i)=>i));
  introEl.classList.add('hidden');thankYouEl.classList.add('hidden');
  quizArea.classList.remove('hidden');restartIcon.classList.remove('show');restartIcon.style.display='none';
  messageEl.textContent="";answerInput.value="";showQuestion();answerInput.focus();
}
function showQuestion(){const q=questions[randomizedOrder[currentQIndex]];questionBox.textContent=`🧑‍💻 Question ${q.id} ➡️ ${q.text}`;messageEl.textContent="";answerInput.value="";}
function checkAnswer(){
  const q=questions[randomizedOrder[currentQIndex]];
  const matched=isAnswerCorrect(answerInput.value,q.correctKeywords);
  const correctText=`✔ အဖြေမှန်👉 ${q.correctKeywords.join(", ")}`;
  if(matched){
    score+=POINTS_PER_QUESTION;
    messageEl.innerHTML=`🎉 ${correctText}`;messageEl.className="message congrats";
    correctSound.play().catch(()=>{});showCongratsOverlay();
    setTimeout(()=>{nextStep();},3500);
  } else {
    messageEl.innerHTML=`❌ ${correctText}`;messageEl.className="message fail";
    wrongSound.play().catch(()=>{});setTimeout(()=>{nextStep();},2500);
  }
}
function nextStep(){
  currentQIndex++;
  if(currentQIndex>=questions.length){
    quizArea.classList.add('hidden');thankYouEl.classList.remove('hidden');
    finalScoreEl.textContent=`ရော့ကွာ ${playerName} ရတဲ့ အမှတ်🫴: ${score}`;
    restartIcon.style.display='flex';restartIcon.classList.add('show');bgMusic.pause();
    sendToTelegram(`📊 Player: ${playerName}\nScore: ${score}`);
  } else {showQuestion();}
}

/* listeners */
setTimeout(()=>{introEl.classList.add('hidden');totalPointsEl.textContent=`ဖြေဆိုရမည့် အမှတ်စုစုပေါင်း: ${questions.length*POINTS_PER_QUESTION}`;},3000);
document.getElementById('startBtn').addEventListener('click',()=>{bgMusic.play().catch(()=>{});document.getElementById('startBtn').classList.add('hidden');nameBox.classList.remove('hidden');});
nameSubmitBtn.addEventListener('click',()=>{
  const rawName=nameInput.value||"";playerName=rawName.trim();
  if(playerName.length<1){alert("Please enter your name 😅");return;}
  sendToTelegram(`🎮 New Player Joined!\nName: ${playerName}`);
  const key=normalizeText(playerName);
  if(normalizedNameImageMap[key]){showSpecialImage(playerName,normalizedNameImageMap[key]);}else{startQuiz();}
});
submitBtn.addEventListener('click',checkAnswer);
answerInput.addEventListener('keyup',e=>{if(e.key==="Enter")checkAnswer();});
restartIcon.addEventListener('click',()=>{startQuiz();bgMusic.currentTime=0;bgMusic.play().catch(()=>{});});
</script>
</body>
</html>
