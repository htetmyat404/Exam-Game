<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Htetmyat Quiz Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');
    body {
      background: linear-gradient(135deg, #1f1c2c, #928DAB);
      font-family: 'Poppins', sans-serif;
      margin: 0; padding: 0;
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 380px;
      padding: 30px 40px 60px 40px;
      box-shadow: 0 0 35px rgba(0,0,0,0.4), 0 0 40px rgba(255,255,255,0.1) inset;
      text-align: center;
      position: relative;
    }
    .intro-text {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ff6a00, #ee0979);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glowText 3s ease infinite;
    }
    @keyframes glowText {
      0%,100% { text-shadow: 0 0 5px #ff6a00, 0 0 10px #ee0979; }
      50% { text-shadow: 0 0 20px #ff6a00, 0 0 40px #ee0979; }
    }
    .hidden { display: none; }
    .question-box {
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 18px;
      font-size: 1.1rem;
      animation: fadeInUp 0.7s ease forwards;
      box-shadow: 0 0 15px rgba(255,255,255,0.1) inset;
    }
    @keyframes fadeInUp {
      0% {opacity: 0; transform: translateY(20px);}
      100% {opacity: 1; transform: translateY(0);}
    }
    input[type="text"] {
      margin-top: 15px; padding: 12px 16px; font-size: 1rem;
      border: none; border-radius: 25px; width: 90%; outline: none;
      background: rgba(255,255,255,0.15);
      color: white;
      transition: 0.3s ease;
    }
    input[type="text"]:focus {box-shadow: 0 0 12px #ff6a00;}
    button {
      margin-top: 20px;
      background: linear-gradient(90deg,#ff6a00,#ee0979);
      border: none;
      padding: 12px 25px; font-size: 1rem;
      border-radius: 25px;
      cursor: pointer; color: white; font-weight: 700;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #ff6a00,0 0 30px #ee0979;
    }
    .message {
      margin-top: 15px; font-weight: 600; font-size: 1.2rem; min-height: 1.5em;
    }
    .congrats {color: #4caf50; animation: popIn 0.8s ease forwards;}
    .fail {color: #f44336; animation: shake 0.6s ease forwards;}
    @keyframes popIn {0% {transform: scale(0.5); opacity: 0;}100% {transform: scale(1); opacity: 1;}}
    @keyframes shake {0%,100% {transform: translateX(0);}20%,60% {transform: translateX(-10px);}40%,80% {transform: translateX(10px);}}
    .restart-icon {
      position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
      cursor: pointer; background: linear-gradient(135deg,#ee0979,#ff6a00);
      padding: 25px; border-radius: 50%;
      font-weight: 700; font-size: 3rem; user-select: none;
      box-shadow: 0 0 25px #ff6a00, 0 0 35px #ee0979;
      display: none; flex-direction: column; align-items: center;
      transition: 0.3s ease;
    }
    .restart-icon:hover {transform: translateX(-50%) scale(1.1);}
    .restart-text {font-size: 1.2rem; margin-top: 6px; font-weight: 600; color: #fff;}
    #finalScore {font-size: 1.6rem; font-weight: 700; margin-top: 30px;
      background: linear-gradient(90deg, #43cea2, #185a9d);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: glowText 3s ease infinite;
    }
    #totalPoints {margin-top: 15px; font-size: 1.1rem; font-weight: 600; color: #ffeb3b;}
  </style>
</head>
<body>
  <div class="container">
    <div id="intro" class="intro-text">🔥 Quiz Challenge 🔥</div>
    <div id="totalPoints"></div>

    <button id="startBtn">Start Quiz</button>

    <div id="nameBox" class="hidden">
      <div class="question-box">🧑‍🏫 What is your name?</div>
      <input type="text" id="nameInput" placeholder="Enter your name..." />
      <button id="nameSubmitBtn">Confirm</button>
    </div>

    <div id="quizArea" class="hidden">
      <div id="questionBox" class="question-box"></div>
      <input type="text" id="answerInput" placeholder="ဖြေဆိုရန် 📝" autocomplete="off" />
      <button id="submitBtn">အဖြေ တိုက်မည်</button>
      <div id="message" class="message"></div>
    </div>

    <div id="thankYou" class="hidden">
      <div id="finalScore" class="congrats"></div>
    </div>

    <div id="restartIcon" class="restart-icon" title="Restart Quiz">
      <div class="arrow">&#10227;</div>
      <div class="restart-text">ပြန်ဆော့မယ်</div>
    </div>
  </div>

  <audio id="bgMusic" src="assets/background.mp3" loop></audio>
  <audio id="correctSound" src="assets/correct.mp3"></audio>
  <audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
/* sample questions */
const questions = [
  {id:1,text:"Computer အဓိက အပိုင်း ၃ ပိုင်း",correctKeywords:["computer","network","power"]},
  {id:2,text:"ဖုန်းစက် နှိုးဖို့ အနည်းဆုံး ဗို့အား",correctKeywords:["3.6","3.6v"]},
  {id:3,text:"Network နှစ်မျိုး",correctKeywords:["with sim","without sim"]}
];
const POINTS_PER_QUESTION = 2;
let currentQIndex = 0;
let randomizedOrder = [];
let score = 0;
let playerName = "";

const introEl = document.getElementById('intro');
const totalPointsEl = document.getElementById('totalPoints');
const quizArea = document.getElementById('quizArea');
const questionBox = document.getElementById('questionBox');
const answerInput = document.getElementById('answerInput');
const submitBtn = document.getElementById('submitBtn');
const messageEl = document.getElementById('message');
const thankYouEl = document.getElementById('thankYou');
const finalScoreEl = document.getElementById('finalScore');
const restartIcon = document.getElementById('restartIcon');
const bgMusic = document.getElementById('bgMusic');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');

const nameBox = document.getElementById('nameBox');
const nameInput = document.getElementById('nameInput');
const nameSubmitBtn = document.getElementById('nameSubmitBtn');

/* helpers */
function shuffleArray(array){let arr=array.slice();for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function normalizeText(text){return (text||"").toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()?"“”‘’]/g,'').replace(/\s+/g,' ').trim();}
function isAnswerCorrect(userInput, keywords){const normalizedInput=normalizeText(userInput);return keywords.some(keyword=>normalizedInput.includes(normalizeText(keyword)));}

/* Telegram */
function sendToTelegram(name){
  const token = "7602210710:AAGp7tskS5W95pf2WaF-gOb6sy9qzxImXJY"; // ✅ Bot Token
  const chatId = "7358958980"; // ✅ Chat ID
  const message = `🎮 New Player Joined!\nName: ${name}`;
  fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ chat_id: chatId, text: message })
  });
}
function sendFinalScore(name, score){
  const token = "7602210710:AAGp7tskS5W95pf2WaF-gOb6sy9qzxImXJY"; 
  const chatId = "7358958980";
  const message = `🏆 Quiz Finished!\n👤 Player: ${name}\n✅ Score: ${score}`;
  fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ chat_id: chatId, text: message })
  });
}

/* game logic */
setTimeout(()=>{introEl.classList.add('hidden');totalPointsEl.textContent=`ဖြေဆိုရမည့် အမှတ်စုစုပေါင်း: ${questions.length*POINTS_PER_QUESTION}`;},3000);
document.getElementById('startBtn').addEventListener('click',()=>{
  bgMusic.play().catch(()=>{});document.getElementById('startBtn').classList.add('hidden');nameBox.classList.remove('hidden');
});
nameSubmitBtn.addEventListener('click',()=>{
  playerName=nameInput.value.trim();if(playerName.length<1){alert("Please enter your name 😅");return;}
  sendToTelegram(playerName);
  nameBox.classList.add('hidden');startQuiz();
});
function startQuiz(){score=0;currentQIndex=0;randomizedOrder=shuffleArray(questions.map((_,i)=>i));
  thankYouEl.classList.add('hidden');quizArea.classList.remove('hidden');restartIcon.style.display='none';
  showQuestion();
}
function showQuestion(){const q=questions[randomizedOrder[currentQIndex]];questionBox.textContent=`❓ Q${q.id}: ${q.text}`;messageEl.textContent="";answerInput.value="";answerInput.focus();}
function checkAnswer(){
  const q=questions[randomizedOrder[currentQIndex]];const userAnswer=answerInput.value;const matched=isAnswerCorrect(userAnswer,q.correctKeywords);
  if(matched){score+=POINTS_PER_QUESTION;messageEl.textContent="✔ မှန်တယ်!";messageEl.className="message congrats";correctSound.play().catch(()=>{});} 
  else {messageEl.textContent="❌ မှားတယ်";messageEl.className="message fail";wrongSound.play().catch(()=>{});}
  setTimeout(()=>{nextStep();},2000);
}
function nextStep(){
  currentQIndex++;
  if(currentQIndex>=questions.length){
    quizArea.classList.add('hidden');thankYouEl.classList.remove('hidden');
    finalScoreEl.textContent=`${playerName} ရရှိသည့် အမှတ်: ${score}`;
    restartIcon.style.display='flex';
    bgMusic.pause();
    sendFinalScore(playerName, score); // ✅ Final score Telegram ပို့
  } else {showQuestion();}
}
submitBtn.addEventListener('click',checkAnswer);
answerInput.addEventListener('keyup',e=>{if(e.key==="Enter")checkAnswer();});
restartIcon.addEventListener('click',()=>{startQuiz();bgMusic.currentTime=0;bgMusic.play().catch(()=>{});});
</script>
</body>
</html>
