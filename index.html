<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Htetmyat Quiz Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: white;
      overflow: hidden;
    }
    .container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      width: 400px;
      padding: 40px 35px 70px 35px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      text-align: center;
      position: relative;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .intro-text {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(90deg,#ff9966,#ff5e62);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      animation: introFadeGlow 3s forwards;
    }
    @keyframes introFadeGlow {
      0% {opacity: 0; transform: scale(0.7);}
      50% {opacity: 1; text-shadow:0 0 25px #ff9966; transform: scale(1.1);}
      100% {opacity: 1; text-shadow:0 0 10px #ff5e62; transform: scale(1);}
    }
    .hidden { display: none; }
    .question-box {
      margin-top: 20px;
      background: rgba(255,255,255,0.12);
      border-radius: 15px;
      padding: 22px;
      font-size: 1.15rem;
      line-height: 1.4;
      box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
      animation: fadeInUp 0.7s ease forwards;
      min-height: 70px;
    }
    @keyframes fadeInUp {
      0% {opacity: 0; transform: translateY(20px);}
      100% {opacity: 1; transform: translateY(0);}
    }
    input[type="text"] {
      margin-top: 18px;
      padding: 12px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      width: 90%;
      outline: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      backdrop-filter: blur(6px);
      transition: all 0.3s ease;
    }
    input[type="text"]:focus {
      box-shadow: 0 0 10px 2px rgba(255,153,102,0.8);
    }
    button {
      margin-top: 20px;
      background: linear-gradient(90deg,#ff9966,#ff5e62);
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      color: white;
      font-weight: 700;
      transition: all 0.35s ease;
      box-shadow: 0 4px 20px rgba(255,94,98,0.4);
    }
    button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 30px rgba(255,94,98,0.6);
    }
    .message {margin-top: 15px; font-weight: 600; font-size: 1.2rem; min-height: 1.5em;}
    .congrats {color: #4caf50; animation: popIn 0.8s ease forwards;}
    .fail {color: #f44336; animation: shake 0.6s ease forwards;}
    @keyframes popIn {0% {transform: scale(0.5); opacity: 0;}100% {transform: scale(1); opacity: 1;}}
    @keyframes shake {0%,100% {transform: translateX(0);}20%,60% {transform: translateX(-10px);}40%,80% {transform: translateX(10px);}}
    .restart-icon {
      position: absolute; top: -120px; left: 50%; transform: translateX(-50%);
      cursor: pointer; background: linear-gradient(135deg,#ff9966,#ff5e62);
      padding: 30px 40px; border-radius: 50%;
      font-weight: 700; font-size: 3.5rem; user-select: none;
      box-shadow: 0 0 30px rgba(255,94,98,0.7);
      display: none; transition: all 0.3s ease, transform 0.3s ease;
      flex-direction: column; align-items: center; justify-content: center;
      animation-fill-mode: forwards;
    }
    .restart-icon:hover {transform: translateX(-50%) scale(1.1);}
    .restart-icon.show {display: flex; animation: bounceIn 1s ease forwards;}
    @keyframes bounceIn {
      0% {opacity: 0; transform: translateX(-50%) scale(0.3);}
      50% {opacity: 1; transform: translateX(-50%) scale(1.2);}
      100% {transform: translateX(-50%) scale(1);}
    }
    .restart-text {font-size: 1.2rem; margin-top: 6px; font-weight: 600; color: #fff; user-select: none; text-shadow: 0 0 12px #feb47b;}
    #finalScore {font-size: 1.8rem; font-weight: 700; background: linear-gradient(90deg, #43cea2, #185a9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-top: 30px;}
    #totalPoints {margin-top: 15px; font-size: 1.2rem; font-weight: 600; color: #feb47b; text-shadow: 0 0 8px #feb47b;}
  </style>
</head>
<body>
  <div class="container">
    <div id="intro" class="intro-text">Unknown BG</div>
    <div id="totalPoints"></div>
    <button id="startBtn">Start Music</button>
    <div id="nameBox" class="hidden">
      <div class="question-box">🧑‍🏫 What is your name?</div>
      <input type="text" id="nameInput" placeholder="Enter your name..." />
      <button id="nameSubmitBtn">Confirm</button>
    </div>
    <div id="quizArea" class="hidden">
      <div id="questionBox" class="question-box"></div>
      <input type="text" id="answerInput" placeholder="ဖြေဆိုရန် 📝" autocomplete="off" />
      <button id="submitBtn">အဖြေတိုက်မည်</button>
      <div id="message" class="message"></div>
    </div>
    <div id="thankYou" class="hidden">
      <div id="finalScore" class="congrats"></div>
    </div>
    <div id="restartIcon" class="restart-icon" title="Restart Quiz">
      <div class="arrow">&#10227;</div>
      <div class="restart-text">ပြန် ဆော့ရန်</div>
    </div>
  </div>

  <!-- Audio -->
  <audio id="bgMusic" src="assets/background.mp3" loop></audio>
  <audio id="correctSound" src="assets/correct.mp3"></audio>
  <audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
/* ---------------- questions + config ---------------- */
const questions = [
  {id:1,text:"အဓိက အပိုင်း ၃ပိုင်း ကို ဖြေဆိုပါ",correctKeywords:["computer","network","power"]},
  {id:2,text:"ဖုန်းတစ်လုံးကို စက်နှိုးဖို့ ဗို့အား အနည်းဆုံး ဘယ်လောက်ရှိရမလဲ?",correctKeywords:["3.6","3 6","3.6v"]},
  {id:3,text:"Network ပိုင်းမှာ နှစ်မျိုးရှိတယ် အဲ့တာဘာတေလဲ့ ?",correctKeywords:["sim လိုတဲ့ network","sim မလိုတဲ့ network","with sim","without sim"]},
  {id:4,text:"Coil ရဲ့ စာသင်ကေတတေ ဖြေဆိုပါ English!",correctKeywords:["l","lb","pl","fb","b"]},
  {id:5,text:"Computer ပိုင်းမှာ ဘာတေရှိလဲ့ Englishလိုဖြေ?",correctKeywords:["cpu","emmc"]},
  {id:6,text:"Phone တစ်လုံးမှာ Battery ငုတ် ဘယ်နှစ်ငုတ်ပါလဲ့?",correctKeywords:["4","5","၄","၅"]},
  {id:7,text:"ဖုန်းservice လုပ်တော့မယ်ဆို အကြမ်းဖျင်း heatgun အပူ ဘယ်လောက်လဲ့? လေကရော ဘယ်လောက်လဲ့?",correctKeywords:["365","55","365°","55°"]},
  {id:8,text:"Crystal ရဲ့ စာသင်ကေတက ဘာလဲ့?",correctKeywords:["x","y"]},
  {id:9,text:"Phone တစ်လုံးမှာ Batteryပင် 5ပင် ပါတယ်ဆိုရင် 2ပင်က +- 2ပင်က detat(ဒီတက်😁)ဆိုရင် ကျန်တဲ့ 1ပင်က ဘာပင်ဖြစ်မလဲ့?",correctKeywords:["nc"]},
  {id:10,text:"4ပင် crystalအကြီး က ဘယ်အပိုင်းမှာရှိလဲ့?",correctKeywords:["sim မလိုတဲ့ network","without sim","no sim"]},
  {id:11,text:"Aug 20 2025 တုန်းက ၅လွှာအတက်ဆင်းလုပ်ရတာ ပျော်လား?",correctKeywords:["ဆရာမေးခွန်းသတ်တာ"]},
  {id:12,text:"2ပင် crystal က ဘယ်အပိုင်းမှာရှိလဲ့?",correctKeywords:["power","main pmu"]},
  {id:13,text:"မီတာ တိုင်းတာနည်း ဘယ်နှစ်နည်းရှိလဲ့? 2နည်း 3နည်း 4နည်း 5နည်း?",correctKeywords:["4နည်း","4"]},
  {id:14,text:"crystal ဘယ်နှစ်မျိုးရှိလဲ?",correctKeywords:["2"]},
  {id:15,text:"zero ohm တေပျက်ရင် ခဲပူးလို့ရလား yes or no ဖြေ?",correctKeywords:["no"]},
  {id:16,text:"R တွေပျက်ရင် error အတိကျရှိလား yes or no ဖြေ?",correctKeywords:["no"]},
  {id:17,text:"R အမျိုးအစား ဘယ်နှစ်မျိုးရှိသလဲ့?",correctKeywords:["2"]},
  {id:18,text:"Capacitor ဘယ်နှစ်မျိုးရှိလဲ့?",correctKeywords:["3"]},
  {id:19,text:"Fitter Capacitor ကဘယ်နေရာမှာရှိလဲ?",correctKeywords:["နေရာတိုင်း"]},
  {id:20,text:"Fuse က ဘယ်နေရာမှာရှိလဲ?",correctKeywords:["CHG","ခေါင်းနားမှာ"]},
  {id:21,text:"Fuse ပျက်လျှင် ဘာerrorဖြစ်လဲ?",correctKeywords:["CHG","အားမဝင်"]},
  {id:22,text:"Copuling Capacitor က ဘယ်နေရာမှာရှိလဲ့?",correctKeywords:["CHG","SPK"]}
];
const POINTS_PER_QUESTION=2;
let currentQIndex=0,randomizedOrder=[],score=0,playerName="";

/* ---------------- element refs ---------------- */
const introEl=document.getElementById('intro');
const totalPointsEl=document.getElementById('totalPoints');
const quizArea=document.getElementById('quizArea');
const questionBox=document.getElementById('questionBox');
const answerInput=document.getElementById('answerInput');
const submitBtn=document.getElementById('submitBtn');
const messageEl=document.getElementById('message');
const thankYouEl=document.getElementById('thankYou');
const finalScoreEl=document.getElementById('finalScore');
const restartIcon=document.getElementById('restartIcon');
const bgMusic=document.getElementById('bgMusic');
const correctSound=document.getElementById('correctSound');
const wrongSound=document.getElementById('wrongSound');
const nameBox=document.getElementById('nameBox');
const nameInput=document.getElementById('nameInput');
const nameSubmitBtn=document.getElementById('nameSubmitBtn');

/* helpers */
function playMusicOnce(){if(bgMusic.paused){bgMusic.play().catch(()=>{});}}
function shuffleArray(array){let arr=array.slice();for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function normalizeText(text){return (text||"").toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()?"“”‘’]/g,'').replace(/\s+/g,' ').trim();}
function isAnswerCorrect(userInput,keywords){const normalizedInput=normalizeText(userInput);return keywords.some(keyword=>normalizedInput.includes(normalizeText(keyword)));}

/* Telegram */
function sendToTelegram(name){
  const token="7602210710:AAGp7tskS5W95pf2WaF-gOb6sy9qzxImXJY";
  const chatId="7358958980";
  const message=`🎮 New Player Joined!\nName: ${name}`;
  fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chatId,text:message})});
}
function sendFinalScore(name,score){
  const token="7602210710:AAGp7tskS5W95pf2WaF-gOb6sy9qzxImXJY";
  const chatId="7358958980";
  const message=`🏆 Quiz Finished!\n👤 Player: ${name}\n✅ Score: ${score}`;
  fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chatId,text:message})});
}

/* flow */
setTimeout(()=>{introEl.classList.add('hidden');totalPointsEl.textContent=`ဖြေဆိုရမည့် အမှတ်စုစုပေါင်း: ${questions.length*POINTS_PER_QUESTION}`;},3500);
document.getElementById('startBtn').addEventListener('click',()=>{playMusicOnce();document.getElementById('startBtn').classList.add('hidden');nameBox.classList.remove('hidden');});
nameSubmitBtn.addEventListener('click',()=>{const rawName=nameInput.value||"";playerName=rawName.trim();if(playerName.length<1){alert("Please enter your name 😅");return;}sendToTelegram(playerName);nameBox.classList.add('hidden');startQuiz();});
function startQuiz(){score=0;currentQIndex=0;randomizedOrder=shuffleArray(questions.map((_,i)=>i));quizArea.classList.remove('hidden');thankYouEl.classList.add('hidden');restartIcon.style.display='none';showQuestion();}
function showQuestion(){const q=questions[randomizedOrder[currentQIndex]];questionBox.textContent=`🧑‍💻 Question ${q.id} ➡️ ${q.text}`;messageEl.textContent="";answerInput.value="";}
function checkAnswer(){playMusicOnce();const q=questions[randomizedOrder[currentQIndex]];const matched=isAnswerCorrect(answerInput.value,q.correctKeywords);if(matched){score+=POINTS_PER_QUESTION;messageEl.textContent="✔ အဖြေမှန်!";correctSound.play().catch(()=>{});}else{messageEl.textContent=`❌ အဖြေမှန် 👉 ${q.correctKeywords.join(", ")}`;wrongSound.play().catch(()=>{});}setTimeout(()=>nextStep(),2000);}
function nextStep(){currentQIndex++;if(currentQIndex>=questions.length){quizArea.classList.add('hidden');thankYouEl.classList.remove('hidden');finalScoreEl.textContent=`ရော့ကွာ ${playerName} ရတဲ့ အမှတ်🫴: ${score}`;restartIcon.style.display='flex';restartIcon.classList.add('show');bgMusic.pause();sendFinalScore(playerName,score);}else{showQuestion();}}
submitBtn.addEventListener('click',checkAnswer);
answerInput.addEventListener('keyup',e=>{if(e.key==="Enter")checkAnswer();});
restartIcon.addEventListener('click',()=>{startQuiz();bgMusic.currentTime=0;playMusicOnce();});
</script>
</body>
</html>
